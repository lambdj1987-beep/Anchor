const days=[
{verse:'Proverbs 3:5–6',scripture:'Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.',thought:'Trust is not knowing every outcome. It is choosing to walk faithfully in the next step.',recovery:'Recovery asks for honesty and willingness today, not certainty about tomorrow.',wisdom:'Epictetus taught us to distinguish what depends on our choices from what does not. Practise the distinction without confusing it with surrender to God.',question:'Where can I practise trust instead of control today?'},
{verse:'Psalm 143:8',scripture:'Cause me to hear thy lovingkindness in the morning; for in thee do I trust: cause me to know the way wherein I should walk; for I lift up my soul unto thee.',thought:'Guidance can begin with a simple prayer and a willingness to listen.',recovery:'You do not have to carry the whole future. Reach out, stay connected, and do the next right thing.',wisdom:'Marcus Aurelius often returned to the idea that we can meet the present task with integrity, regardless of external circumstances.',question:'What is the next right thing in front of me?'},
{verse:'Lamentations 3:22–23',scripture:'It is of the LORD’s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.',thought:'Today is not merely a continuation of yesterday. Mercy invites a fresh beginning.',recovery:'A difficult day does not erase the work of recovery. Be truthful, ask for help and begin again.',wisdom:'The Stoics encouraged a daily return to virtue: courage, justice, moderation and wisdom.',question:'What can I begin again today without shame?'},
{verse:'Micah 6:8',scripture:'He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?',thought:'A faithful life is made up of ordinary acts of justice, kindness and humility.',recovery:'Keep your side of the street clean. Practise honesty and make amends when appropriate.',wisdom:'Character is built by repeated choices, especially when nobody is watching.',question:'How will I show kindness and humility today?'},
{verse:'Isaiah 41:10',scripture:'Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.',thought:'Courage does not require the absence of fear.',recovery:'When the day feels heavy, connection and small actions matter more than heroic promises.',wisdom:'Seneca explored how imagined troubles can burden the present. Return your attention to what is actually before you.',question:'What fear can I meet with one small courageous action?'},
{verse:'Philippians 4:6–7',scripture:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.',thought:'Prayer is a place to bring anxiety, not a test you must pass before feeling peace.',recovery:'Share what is troubling you rather than isolating with it.',wisdom:'You can respond to an anxious thought without obeying it.',question:'What worry can I name and release today?'},
{verse:'Psalm 4:8',scripture:'I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.',thought:'Rest is not something you have to earn by completing every task.',recovery:'Take stock, put right what you can, and let the rest wait until tomorrow.',wisdom:'A reflective life includes knowing when to stop striving.',question:'What can I leave in God’s hands today?'}
];

const themes=[
{title:'Surrender without passivity',reference:'Proverbs 3:5–6',scripture:'Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.',context:`Proverbs is wisdom literature, not a promise that faithful people will never face confusion or suffering. The instruction is not to stop thinking. It is to refuse to treat your own understanding as the final authority. The word “all” matters: trust is not reserved for church or crisis, but extends to work, relationships, money, uncertainty and the small choices nobody sees.\n\nAsk a harder question than “Do I believe in God?”: when my plans are interrupted, whose wisdom do I actually follow? Trust may mean acting responsibly while accepting that I cannot dictate the outcome.`,recovery:`Surrender is easily misunderstood as defeat. In recovery, it can mean admitting that willpower alone has not been a reliable solution and choosing honesty, fellowship and spiritual help instead. The Third Step points towards a decision that must be practised, not merely announced.\n\nConsider the difference between responsibility and control. You are responsible for your choices, your willingness to ask for help, and whether you tell the truth. You are not responsible for managing everyone else's emotions or guaranteeing tomorrow. Trying to control everything can become another way of avoiding fear.\n\nThe difficult practice today is to notice where self-reliance turns into isolation. When that happens, reach out rather than retreat.`,wisdom:`Epictetus, a Stoic teacher, distinguished what belongs to our agency—our judgements and choices—from what does not, such as reputation and other people's actions. This is a paraphrase of his central distinction, not a direct quotation.\n\nChristian surrender and Stoic discipline are not identical: Christian trust is relational, grounded in God, whereas Stoicism locates moral freedom in reasoned judgement. But both challenge the exhausting fantasy of total control. The test is practical: can you act well without demanding certainty?`,challenge:'Where am I confusing being responsible with being in control?',carry:'I can be faithful in my actions without controlling the outcome.'},
{title:'Gratitude without denial',reference:'1 Thessalonians 5:18',scripture:'In every thing give thanks: for this is the will of God in Christ Jesus concerning you.',context:`Paul's instruction appears alongside calls to rejoice, pray and discern what is good. Notice the wording: “in every thing,” not “for every harmful thing.” Gratitude need not call suffering good. It can be an act of attention: looking for evidence of grace without pretending that pain has vanished.\n\nA shallow version of gratitude counts blessings to silence discomfort. A deeper version allows two truths at once: today is difficult, and there is still something worth receiving with thanks.`,recovery:`A sober life can become ordinary. That's one of recovery's quiet miracles—and one of its risks. Familiarity can make restored trust, stable routines and relationships seem unremarkable. Gratitude is not a demand to feel cheerful; it is a discipline of remembering accurately.\n\nAsk what you once hoped for that you now treat as background noise. Then ask what gratitude should change about your behaviour. If you're thankful for a relationship, how will you show up in it? If you're thankful for recovery, what action protects it today?`,wisdom:`Seneca wrote often about how desire can keep moving the finish line. His broader argument invites us to notice what we already possess rather than endlessly measuring what is missing. This is a summary of a theme in his moral letters, not a quotation.\n\nGratitude does not cancel ambition. It stops ambition from making the present invisible.`,challenge:'What ordinary freedom have I begun to take for granted?',carry:'I can want a better future without overlooking today’s gifts.'},
{title:'Acceptance and action',reference:'Philippians 4:11–13',scripture:'Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content. I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need. I can do all things through Christ which strengtheneth me.',context:`Paul writes about contentment amid changing circumstances, including scarcity. Verse 13 is often treated as a promise of unlimited achievement. In context, it concerns strength to remain faithful through both lack and abundance. Contentment is learned, not automatically felt.\n\nThis challenges the belief that peace must wait until every external problem is solved. It also challenges complacency: acceptance of reality can be the starting point for wise action.`,recovery:`Acceptance does not mean approving of what happened or resigning yourself to harm. It means seeing reality clearly enough to respond. Denial asks reality to change before we act. Acceptance asks, “Given what is true, what is the next honest step?”\n\nIn recovery, that might mean acknowledging a craving without obeying it, admitting resentment without feeding it, or accepting help without needing to look strong. Notice where you are bargaining with facts today.`,wisdom:`Marcus Aurelius repeatedly considered how to meet unwelcome events with steadiness and duty. Stoicism is not emotional numbness: the task is to examine judgements and choose a response aligned with character.\n\nA Christian perspective adds that endurance is not solitary self-sufficiency; Paul's strength is explicitly “through Christ.”`,challenge:'What reality am I resisting, and what constructive action remains open to me?',carry:'Acceptance clears the ground for the next right action.'},
{title:'Honesty in the hidden places',reference:'Psalm 139:23–24',scripture:'Search me, O God, and know my heart: try me, and know my thoughts: And see if there be any wicked way in me, and lead me in the way everlasting.',context:`Psalm 139 begins with God's intimate knowledge of the psalmist. The closing invitation to be searched is striking because it follows the recognition that nothing is hidden from God. This is not a request for endless self-condemnation. It is a willingness to let truth expose what needs healing and direction.\n\nThe challenging question is not only whether others can see a problem, but whether you are prepared to see it yourself.`,recovery:`The Tenth Step calls for continued personal inventory and prompt admission when wrong. It is a practice of course correction, not a nightly prosecution. Pay attention to patterns: defensiveness, exaggeration, resentment, avoidance, fear. Equally, notice evidence of growth.\n\nA useful inventory asks: What happened? What did I feel? What did I do? What responsibility is mine? What action would repair or improve matters? Avoid turning every uncomfortable emotion into a moral failure.`,wisdom:`Socrates is associated with the examined life. Philosophical self-examination asks us to question easy stories about our motives. But introspection without action can become rumination.\n\nThe purpose of examining your life is to live it more truthfully, not to spend it endlessly analysing yourself.`,challenge:'Where am I telling myself a convenient story instead of the whole truth?',carry:'Honesty is an invitation to change, not a sentence of shame.'},
{title:'Courage in ordinary life',reference:'Joshua 1:9',scripture:'Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.',context:`Joshua receives this charge during a particular transition of leadership and responsibility. We should not turn it into a guarantee that every personal ambition will succeed. The wider biblical principle is that courage can coexist with fear when duty is faced in trust.\n\nCourage often looks less dramatic than we expect: a difficult apology, an honest conversation, attending a meeting, or showing up when you'd rather hide.`,recovery:`Recovery asks for repeated acts of courage that may be invisible to others. Admitting vulnerability, asking for support, declining an old escape route and returning after a difficult day all require it.\n\nDon't confuse courage with proving that you need nobody. Sometimes the brave choice is making a phone call. Identify one thing you are avoiding because it threatens your pride or comfort, then choose a safe, manageable first step.`,wisdom:`Aristotle described courage as a virtue between cowardice and recklessness. The point is not to seek danger or feel no fear, but to judge what is worth facing and how.\n\nA courageous response is proportionate. You can be firm without being aggressive and vulnerable without surrendering your values.`,challenge:'What small, responsible act of courage is available to me today?',carry:'Courage is doing what is right while fear is still present.'},
{title:'Humility that makes room for growth',reference:'James 4:6–10',scripture:'But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace unto the humble. Submit yourselves therefore to God. Resist the devil, and he will flee from you. Draw nigh to God, and he will draw nigh to you.',context:`James challenges quarrels, envy and divided loyalties. Humility here is not self-hatred or pretending you have no gifts. It is a truthful recognition of dependence on God and a refusal to make ego the centre of everything.\n\nThe question is whether being right, admired or in control has become more important than being teachable.`,recovery:`Humility in recovery means being willing to receive correction and help. It also means recognising progress without turning it into superiority. You can be proud of the work you've done while remaining honest about your vulnerabilities.\n\nWhen you feel defensive today, pause. Is the feedback unfair, partly true, or simply uncomfortable? You don't have to accept every criticism, but you can examine it without automatically attacking or withdrawing.`,wisdom:`Philosophical humility begins by recognising the limits of our knowledge. Socrates' questioning method exposes how confidently people can hold unexamined assumptions.\n\nChristian humility goes further: it is expressed in service, repentance and reliance on grace.`,challenge:'Where could I choose curiosity over defensiveness?',carry:'Being teachable is stronger than needing to appear right.'},
{title:'Hope with endurance',reference:'Romans 5:3–5',scripture:'And not only so, but we glory in tribulations also: knowing that tribulation worketh patience; And patience, experience; and experience, hope: And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.',context:`Paul describes a chain from suffering through perseverance and tested character to hope. This does not require enjoying pain or pretending that every hardship has an obvious explanation. His hope is grounded in God's love, not in a prediction that life will quickly become easy.\n\nThe passage invites a long view: character can be formed through faithful endurance, even when progress is slow.`,recovery:`Recovery is not a single heroic transformation. It is a series of ordinary decisions, relationships, repairs and returns. Some days feel inspired; others feel flat. Neither feeling is a reliable measure of your worth or progress.\n\nThink about a difficulty you've survived without returning to an old destructive pattern. What helped? Which people, practices or truths kept you moving? Let the answer become a practical plan for the next difficult day.`,wisdom:`Viktor Frankl wrote about meaning and human response under extreme suffering. His work should never be used to minimise another person's pain. A useful insight is that meaning can be found through responsibility, relationships and the stance we take toward unavoidable hardship.\n\nChristian hope is not merely personal resilience; it also rests on God's promises.`,challenge:'What has perseverance taught me that comfort never could?',carry:'A difficult chapter is not the whole story.'}
];

const extraThemes=[{"title": "Patience in small things", "reference": "James 1:19", "scripture": "Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath:", "context": "James addresses believers learning to live their faith under pressure. His sequence is practical: listening before speaking interrupts the rush to defend ourselves. Being slow to anger does not mean tolerating mistreatment; it means choosing the timing and manner of our response.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Recovery gives us opportunities to practise a pause between feeling and action. A sharp reply can become an unnecessary resentment. Ask whether you need to speak now, later, or not at all.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Seneca examined anger as a judgement that can gather momentum when rehearsed. Stoic practice invites us to question the story we are telling about an offence before acting on it.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Where can I listen more carefully today?", "carry": "A pause can protect a relationship."}, {"title": "The freedom of enough", "reference": "1 Timothy 6:6", "scripture": "But godliness with contentment is great gain.", "context": "Paul contrasts contentment with the restless pursuit of wealth. The passage does not condemn earning or saving; it challenges the belief that more possessions will finally make us secure.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Recovery can restore ordinary freedoms once thought impossible. Ambition has a place, but gratitude keeps the present from disappearing while we pursue the future.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Epictetus connected freedom to the way we relate to desire. The Stoic aim is not to own nothing, but not to be owned by what we want.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What does enough look like for today?", "carry": "I can build tomorrow without missing today."}, {"title": "Forgiveness and boundaries", "reference": "Ephesians 4:32", "scripture": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.", "context": "Paul places forgiveness within a wider call to truthful, loving conduct. Forgiveness is not the same as pretending harm never occurred, and reconciliation may require changed behaviour and restored trust.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "An honest inventory may reveal resentments we are carrying. We can release revenge without denying injury. Amends and forgiveness work best with wisdom, safety and time.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic thinkers distinguished another person’s actions from our own character. We can refuse bitterness while still setting reasonable boundaries.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Where do I need both kindness and clarity?", "carry": "Mercy and boundaries can coexist."}, {"title": "Service without self-erasure", "reference": "Galatians 6:2", "scripture": "Bear ye one another’s burdens, and so fulfil the law of Christ.", "context": "Paul describes a community that helps people carry real burdens. The surrounding chapter also speaks about personal responsibility. Both belong together: we can support others without assuming we must control their lives.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Service can interrupt self-absorption and isolation. But service done from fear or a need to be indispensable may lead to exhaustion. Notice whether you are helping freely or trying to prevent disapproval.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "The Stoic virtue of justice asks us to act fairly toward others. Fairness includes honest recognition of our own limits and duties.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "How can I help someone without neglecting my responsibilities?", "carry": "I can be useful without being everything to everyone."}, {"title": "Courage to begin again", "reference": "Psalm 51:10", "scripture": "Create in me a clean heart, O God; and renew a right spirit within me.", "context": "David’s prayer is not an attempt to disguise wrongdoing with religious language. He asks for inward renewal. Repentance involves truth, responsibility and a willingness to change direction.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "A difficult day need not become a hopeless story about your identity. Admit what happened, seek help when needed, repair what you can and return to sound practices.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic reflection treats mistakes as material for learning, not proof that improvement is impossible. The next choice remains available.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What small act would show a sincere change of direction?", "carry": "Beginning again is an action, not a feeling."}, {"title": "The gift of ordinary days", "reference": "Ecclesiastes 3:13", "scripture": "And also that every man should eat and drink, and enjoy the good of all his labour, it is the gift of God.", "context": "Ecclesiastes does not offer easy answers to life’s mysteries. It repeatedly calls attention to the ordinary gifts available in the present: work, food, companionship and moments of enjoyment.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Recovery may bring a quieter life than the one we once knew. Quiet is not necessarily emptiness. Sometimes it is the stability we struggled to find.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Marcus Aurelius urged attention to the work and relationships directly before us. Ordinary duties can be places where character is formed.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What ordinary moment can I appreciate without analysing it?", "carry": "An ordinary day can still be a good day."}, {"title": "Truth spoken gently", "reference": "Ephesians 4:15", "scripture": "But speaking the truth in love, may grow up into him in all things, which is the head, even Christ:", "context": "Truth and love are not competing duties. A difficult conversation can be both honest and considerate. The aim is growth, not victory over another person.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "The inventory may show places where silence became avoidance or honesty became harshness. Choose words that own your experience rather than assigning motives to others.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Aristotle’s account of virtue emphasises fitting responses: not too little, not too much, but the right action for the situation.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What truth needs to be said with care?", "carry": "I can be honest without being cruel."}, {"title": "Resentment and release", "reference": "Romans 12:18", "scripture": "If it be possible, as much as lieth in you, live peaceably with all men.", "context": "Paul acknowledges a limit: peace is not always fully possible and not entirely within one person’s control. We are responsible for our contribution, not for forcing agreement.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Resentment can keep an old conflict active long after it ends. Notice the repeated mental argument, then consider a constructive response or a deliberate release.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Epictetus distinguished our own judgements from other people’s decisions. This does not excuse harm; it helps us avoid surrendering our entire day to it.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What conflict am I carrying that needs action or release?", "carry": "I can do my part without controlling the outcome."}, {"title": "Rest and human limits", "reference": "Mark 6:31", "scripture": "And he said unto them, Come ye yourselves apart into a desert place, and rest a while: for there were many coming and going, and they had no leisure so much as to eat.", "context": "Jesus recognises the disciples’ need for rest amid demands. Rest is not a reward for becoming indispensable. Human beings have limits, even when their work matters.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Exhaustion can make cravings, irritability and anxious thoughts harder to manage. A realistic recovery plan includes food, sleep, connection and reasonable expectations.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic discipline is sometimes mistaken for relentless endurance. Wise self-management also involves knowing when recovery and rest support good judgement.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What is one reasonable limit I can honour today?", "carry": "Rest supports responsibility."}, {"title": "Choosing our attention", "reference": "Matthew 6:34", "scripture": "Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.", "context": "Jesus teaches his listeners not to be consumed by tomorrow’s anxieties. This is not a prohibition on planning; it is a warning against allowing imagined futures to steal the present.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "One day at a time is not a small ambition. It is a practical way to face a life that cannot be managed all at once. Plan the next action, then return to today.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Marcus Aurelius repeatedly returned attention to the present task. Our thoughts may travel far ahead, but our choices are made now.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What belongs to today, and what can wait?", "carry": "Today is where I can act."}, {"title": "Humility in disagreement", "reference": "Proverbs 15:1", "scripture": "A soft answer turneth away wrath: but grievous words stir up anger.", "context": "Proverbs offers practical wisdom about speech, not a guarantee that gentleness will always calm another person. Our tone can lower conflict even when agreement is impossible.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Notice whether being understood has become more important than understanding. Pausing to ask one sincere question may change the conversation.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic ethics asks whether we are acting from reasoned purpose or wounded pride. Gentleness can be a sign of strength rather than surrender.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Where could a gentler answer change the tone?", "carry": "I do not need to win every exchange."}, {"title": "The discipline of hope", "reference": "Romans 12:12", "scripture": "Rejoicing in hope; patient in tribulation; continuing instant in prayer;", "context": "Paul places hope, endurance and prayer together. Hope is not a prediction that tomorrow will be easy; it is a way of remaining faithful when outcomes are uncertain.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Recovery is sustained through actions that sometimes feel ordinary: meetings, honest conversations, routines and asking for help. Hope can be practised before it is felt.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Seneca argued that anticipated troubles can weigh heavily on the present. Prepare wisely, but do not rehearse every possible disaster as if it has happened.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What hopeful action can I take without demanding certainty?", "carry": "Hope can be expressed through the next faithful step."}, {"title": "Integrity when unseen", "reference": "Luke 16:10", "scripture": "He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much.", "context": "Jesus links character to small responsibilities. Integrity is not reserved for dramatic moments; it appears in promises kept, words chosen and everyday honesty.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Inventory is especially useful for the small evasions we are tempted to dismiss. A minor exaggeration or avoided responsibility may be an invitation to practise honesty.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Aristotle regarded virtue as formed through repeated action. Character is strengthened by the choices we make when no audience is watching.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What small responsibility deserves my best effort today?", "carry": "Small honest choices shape a life."}, {"title": "Friendship and connection", "reference": "Ecclesiastes 4:9", "scripture": "Two are better than one; because they have a good reward for their labour.", "context": "Ecclesiastes praises companionship in a world where people can become isolated by work or striving. We were not designed to carry every burden alone.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Recovery communities offer perspective that private reflection cannot. If you have drifted from support, reconnecting can begin with one message or one meeting.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic thinkers valued friendship as part of a virtuous life. Independence is not the same as isolation.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Who could I connect with honestly today?", "carry": "Connection is a strength, not a weakness."}, {"title": "Letting feelings pass", "reference": "Psalm 42:11", "scripture": "Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.", "context": "The psalmist speaks openly about distress while also addressing it with hope. Faith does not require pretending every feeling is pleasant or spiritually meaningful.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "A flat afternoon does not always require a full investigation. Notice the feeling, check basic needs, and let it move without turning it into a verdict about your life.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic practice encourages examining the judgement attached to an impression. The first feeling may arrive uninvited; what we do with it matters.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Can I allow a feeling without building a story around it?", "carry": "A feeling is information, not a command."}, {"title": "Stewardship of time", "reference": "Psalm 90:12", "scripture": "So teach us to number our days, that we may apply our hearts unto wisdom.", "context": "This prayer recognises the brevity of life and asks for wisdom rather than panic. Remembering our limits can sharpen our appreciation of what matters.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Recovery offers a daily chance to spend time in ways that strengthen relationships and integrity. Not every hour needs to be productive to be worthwhile.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Marcus Aurelius reflected on mortality to clarify priorities, not to encourage obsession with death. Let finitude make ordinary moments more precious.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What deserves my attention today?", "carry": "I can use this day without needing to solve my whole life."}, {"title": "The strength of gentleness", "reference": "Colossians 3:12", "scripture": "Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering;", "context": "Paul describes virtues to be practised in community. Gentleness is not passivity; it is the strength to respond without unnecessary harm.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "When shame or fear rises, we may become harsh with ourselves and others. Practise accountability without contempt.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoic self-command aims to prevent impulse from ruling conduct. A measured response often requires more strength than an angry one.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Where can I practise firmness with kindness?", "carry": "Gentleness can be courageous."}, {"title": "Making amends wisely", "reference": "Matthew 5:23–24", "scripture": "Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee; Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift.", "context": "Jesus treats reconciliation as morally serious. Yet making amends requires discernment; reconciliation cannot be forced and should not put anyone in danger.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "An inventory becomes useful when it leads to appropriate repair. Identify your part, avoid excuses, and consider whether a direct apology, changed behaviour or advice from a trusted person is needed.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Aristotle’s practical wisdom asks what action fits the circumstances. A sincere intention needs wise execution.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Is there a safe, appropriate repair I can make?", "carry": "Responsibility is shown through action."}, {"title": "A heart that listens", "reference": "Proverbs 18:13", "scripture": "He that answereth a matter before he heareth it, it is folly and shame unto him.", "context": "This proverb warns against premature certainty. Listening is an act of humility, especially when we think we already understand another person’s motives.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "When upset, we may fill gaps in the story with assumptions. Ask what you actually know before reacting.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Socrates’ method begins with questions rather than confident declarations. Curiosity can interrupt the need to be right.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Where am I assuming instead of listening?", "carry": "Understanding begins before my reply."}, {"title": "Joy without perfection", "reference": "John 15:11", "scripture": "These things have I spoken unto you, that my joy might remain in you, and that your joy might be full.", "context": "Jesus speaks of joy in the context of abiding in him and loving one another. Biblical joy is deeper than constant excitement and does not erase grief or difficulty.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "A sober life contains ordinary pleasure: a conversation, a child’s laughter, a peaceful evening. Allow those moments to count without testing whether they are enough.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Stoicism distinguishes lasting flourishing from the pursuit of passing pleasure. Enjoyment has a place when it does not become our sole measure of a good life.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "What simple joy can I receive without questioning it?", "carry": "I can enjoy what is good today."}, {"title": "Trusting through uncertainty", "reference": "Isaiah 26:3", "scripture": "Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.", "context": "Isaiah’s words express trust amid upheaval. They are not a promise that faithful people never experience anxiety; the passage directs attention toward God’s steadfastness.\n\nREAD MORE DEEPLY\n\nConsider who first heard these words, what problem the writer addresses, and what this teaching does not promise. Bring the passage into the ordinary choices of today rather than using it to demand a particular feeling.", "recovery": "Uncertainty is part of recovery and ordinary life. Build supportive routines while accepting that you cannot know every outcome.\n\nPUT IT INTO PRACTICE\n\nWhat would this principle look like in a conversation, a decision or a moment of discomfort? Choose one concrete action. Reflection is useful when it changes how we live, not when it becomes an endless search for faults.", "wisdom": "Epictetus taught that peace depends partly on distinguishing our agency from events. Christian trust adds dependence on a personal God, not simply disciplined judgement.\n\nMEANING AND APPLICATION\n\nStoic philosophy prizes wisdom, justice, courage and moderation. Its aim is not to suppress all emotion, but to examine impressions and respond with character. Consider both the insight and its limits: Christianity and Stoicism may agree on some practices while differing about God, grace and the source of hope.", "challenge": "Where can I act faithfully without knowing the result?", "carry": "Uncertainty does not prevent a faithful next step."}];
themes.push(...extraThemes);
let dayIndex=()=>{let d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%themes.length};
const theme=()=>themes[dayIndex()];
const morning=[
['Arrive & pray',()=>`Take a moment to arrive. Breathe naturally. You don't need to manufacture a feeling.\n\nFather, thank You for this day. Show me where I am clinging to control, avoiding truth or forgetting Your goodness. Give me a willing heart, an honest mind and the courage to do what is right. Help me stay connected to people who support my recovery. Guide my words and actions. In Jesus’ name, Amen.\n\nToday's theme: ${theme().title}.`,'What am I bringing into this morning that I need to acknowledge honestly?'],
['Scripture · study deeply',()=>`${theme().reference} (KJV)\n\n“${theme().scripture}”\n\nREAD THE CONTEXT\n\n${theme().context}\n\nSIT WITH THE TEXT\n\nWhat does this passage reveal about God, human nature, or the kind of life I am called to live? Where might I be resisting its challenge?`,'What does this passage challenge me to believe or do differently?'],
['Recovery · live the principles',()=>`TODAY'S RECOVERY THEME: ${theme().title.toUpperCase()}\n\n${theme().recovery}\n\nONE PRACTICAL RESPONSE\n\nName one action you can take today: a conversation, an honest admission, a meeting, a call, or a small act of service. If you're struggling, contact your sponsor or recovery network rather than relying on this app alone.`,'Where is this principle most relevant to my recovery today?'],
['Wisdom · examine the idea',()=>`${theme().wisdom}\n\nCOMPARE, DON'T CONFUSE\n\nPhilosophy can sharpen your judgement and challenge habits of thought. Scripture remains the foundation of this devotional. You are free to question a philosopher's assumptions rather than adopting them uncritically.\n\nTODAY'S QUESTION\n\n${theme().challenge}`,'What idea is worth testing in my actions today?'],
['Gratitude · look closely',()=>`Name three specific things you are grateful for. For each, ask why it matters and how you could honour it today.\n\nYou may be thankful and tired, hopeful and anxious, or content and ambitious at the same time. Gratitude is attention, not denial.\n\nTry to include one ordinary gift you might otherwise overlook.`,'Three things I am grateful for, and why:'],
['Intention · carry it forward',()=>`TODAY'S THOUGHT TO CARRY\n\n${theme().carry}\n\nChoose one realistic intention. Make it about your response or conduct, not an outcome you cannot guarantee.\n\nAt tonight's Evening Reflection, ANCHOR will bring your intention back to you if you've saved this session.\n\nOne day at a time.`,'Today I intend to…']];
const evening=[
['Arrive & become still',()=>`You do not have to solve everything tonight.\n\nFather, give me courage to tell the truth about today, humility to take responsibility and grace to let go of what I cannot change. Help me see both my shortcomings and the good that was present. Amen.`,'How am I arriving tonight—physically, emotionally and spiritually?'],
['Step 10 · an honest inventory',()=>`The Tenth Step encourages continued personal inventory and prompt admission when wrong. Consider the day without excuses and without cruelty.\n\nWhere was I resentful, selfish, dishonest or afraid? Where did I act with patience, courage, service or restraint? Did I avoid a needed conversation? Did I ask for help when I needed it?\n\nSeparate feelings from actions: feeling anger or fear is not the same as choosing harmful behaviour. Look for a pattern you can learn from, not a verdict on your worth.`,'Where did I act well, where did I fall short, and what can I learn?'],
['Amends & connection',()=>`If you harmed someone, consider what repair would be appropriate. An amend is more than saying sorry, but it should never put you or someone else in danger. Some matters need time, advice or a conversation with your sponsor.\n\nIf there is no amend to make, that is a valid answer. You don't need to invent a failing to complete an inventory.\n\nRemember: honesty is most useful when it leads to wise action.`,'Is there an appropriate amend or conversation to plan?'],
['Gratitude · remember the good',()=>`Recall three moments, people or opportunities from today. Include something small. Then consider one moment when you acted in line with your values.\n\nGratitude and accountability belong together. Neither cancels the other.`,'What am I thankful for tonight?'],
['Scripture · release',()=>`Psalm 4:8 (KJV)\n\n“I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.”\n\nThis psalm speaks of resting in God's care. Rest is not earned by finishing every task or resolving every tension.\n\nYou can identify tomorrow's responsibility without mentally rehearsing it all night.`,'What can I place in God’s hands tonight?'],
['Closing prayer & tomorrow',()=>`Heavenly Father, thank You for sustaining me through today. Forgive what needs forgiving; help me repair what needs repairing. Keep me honest, teachable and grateful. Grant me rest and the willingness to begin again tomorrow. In Jesus’ name, Amen.\n\nYou have done enough reflecting for tonight. Let the day end.\n\nOne day at a time.`,'What is one lesson I want to remember tomorrow?']];
function morningIntention(){let e=entries.find(x=>x.date===dateKey()&&x.mode==='morning');return e?.reflections?.[5]?.answer||''}
function showHome(){let d=new Date(),g=d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening';let recent=entries.filter(x=>x.date===dateKey());$().innerHTML=`<section class="hero"><div class="anchor">⚓</div><div class="eyebrow">A quiet place to return to</div><h1>${g}.</h1><p class="muted">“Which hope we have as an anchor of the soul...”<br><small>Hebrews 6:19 · KJV</small></p></section><button class="card choice" onclick="start('morning')"><div class="eyebrow">☀ Begin with purpose · ~20 min</div><strong>Morning Anchor</strong><span>Prayer · Deep Bible study · Recovery · Philosophy · Gratitude · Intention</span></button><button class="card choice" onclick="start('evening')"><div class="eyebrow">☾ End with peace · ~10–15 min</div><strong>Evening Reflection</strong><span>Prayer · Step 10 · Amends · Gratitude · Scripture · Release</span></button><p class="small">${recent.length?`You have ${recent.length} saved reflection${recent.length===1?'':'s'} today.`:'Your reflections are yours. Nothing to catch up on.'}</p><div class="settings"><button class="btn secondary" onclick="showJournal()">Open journal</button><button class="btn secondary" onclick="exportJournal()">Export backup</button></div>`}
function start(m){mode=m;step=0;answers=Array(6).fill('');renderSession()}
function renderSession(){let list=mode==='morning'?morning:evening;let item=list[step];let carry=mode==='evening'&&step===1&&morningIntention()?`<div class="card"><div class="eyebrow">Your morning intention</div><p>${escapeHtml(morningIntention())}</p><p class="small">How did you live this intention today?</p></div>`:'';$().innerHTML=`<div style="padding-top:40px"><div class="eyebrow">${mode==='morning'?'☀ Morning Anchor':'☾ Evening Reflection'} · ${step+1} of ${list.length}</div><div class="progress"><div style="width:${(step+1)/list.length*100}%"></div></div><h2>${escapeHtml(item[0])}</h2><div class="card"><div class="reading">${escapeHtml(item[1]())}</div></div>${carry}<p class="quote">${escapeHtml(item[2])}</p><textarea id="response" class="field" placeholder="Write here, or simply reflect in silence...">${escapeHtml(answers[step])}</textarea><p class="small">Writing is optional. Reflection is enough.</p><div class="actions"><button class="btn secondary" onclick="back()">${step?'Back':'Home'}</button><button class="btn" onclick="next()">${step===list.length-1?'Finish & save':'Continue →'}</button></div></div>`}
function capture(){answers[step]=document.getElementById('response')?.value||''}function back(){capture();if(step===0)showHome();else{step--;renderSession()}}function next(){capture();let list=mode==='morning'?morning:evening;if(step<list.length-1){step++;renderSession()}else finish()}
function finish(){let list=mode==='morning'?morning:evening;let item={id:Date.now(),date:dateKey(),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),mode,reflections:list.map((x,i)=>({prompt:x[2],answer:answers[i]}))};entries.unshift(item);try{localStorage.setItem(key,JSON.stringify(entries))}catch{alert('Could not save in this browser. Please export your reflections.')} $().innerHTML=`<section class="hero"><div class="anchor">⚓</div><h1>${mode==='morning'?'Go in peace.':'Rest in peace.'}</h1><p>You've made space for what matters.<br>One day at a time.</p><div class="tag">Reflection complete</div></section><div class="actions"><button class="btn secondary" onclick="showHome()">Home</button><button class="btn" onclick="showJournal()">View journal</button></div>`}
function showJournal(){let items=entries.map(e=>`<div class="entry"><div class="eyebrow">${e.mode==='morning'?'☀ Morning':'☾ Evening'} · ${escapeHtml(e.date)} · ${escapeHtml(e.time)}</div>${e.reflections.map(r=>r.answer?`<p><b>${escapeHtml(r.prompt)}</b><br>${escapeHtml(r.answer)}</p>`:'').join('')||'<p class="muted">Quiet reflection — no written notes.</p>'}</div>`).join('');$().innerHTML=`<div style="padding-top:32px"><div class="eyebrow">Private reflections</div><h2>Your journal</h2><p class="muted">Saved only in this browser on this device. Export regularly to keep a backup.</p><div class="settings"><button class="btn" onclick="exportJournal()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept="application/json" onchange="importJournal(event)" hidden></label></div><div class="card">${items||'<p>No entries yet. Start with one quiet moment.</p>'}</div><div class="settings"><button class="btn secondary" onclick="showHome()">Home</button><button class="btn secondary" onclick="clearJournal()">Delete journal</button></div></div>`}
function exportJournal(){let blob=new Blob([JSON.stringify({app:'ANCHOR',version:1,entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='anchor-journal-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importJournal(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(data.app!=='ANCHOR'||!Array.isArray(data.entries))throw Error();if(!confirm('Import this backup and replace the journal currently stored on this device?'))return;entries=data.entries;localStorage.setItem(key,JSON.stringify(entries));showJournal()}catch{alert('That does not look like a valid ANCHOR backup.')}};r.readAsText(f)}function clearJournal(){if(confirm('Permanently delete all saved journal entries from this browser? Export a backup first if you want to keep them.')){entries=[];localStorage.removeItem(key);showJournal()}}

// ANCHOR 1.2 — additive features, original anchor-journal-v1 data preserved.
const libKey='anchor-library-v1',prayerKey='anchor-prayers-v1',freeKey='anchor-free-v1';
function loadArr(k){try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a));return true}catch{alert('Storage unavailable. Please export a backup.');return false}}
let favorites=loadArr(libKey),prayers=loadArr(prayerKey),freeNotes=loadArr(freeKey),allReading=false,speechOn=false;
const themeNumber=()=>dayIndex()+1;
function navigation(){return `<div class="tools"><button class="pill" onclick="showHome()">⌂ Home</button><button class="pill" onclick="showJournal()">Journal</button><button class="pill" onclick="showLibrary()">Saved wisdom</button><button class="pill" onclick="showPrayers()">Prayers</button><button class="pill" onclick="showBackup()">Backup & privacy</button></div>`}
function showHome(){let d=new Date(),g=d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening';let recent=entries.filter(x=>x.date===dateKey());$().innerHTML=`<section class="hero"><div class="anchor">⚓</div><div class="eyebrow">A quiet place to return to · Version 1.2</div><h1>${g}.</h1><p class="muted">“Which hope we have as an anchor of the soul...”<br><small>Hebrews 6:19 · KJV</small></p></section><div class="soft"><div class="small-label">Just for Today · Day ${themeNumber()} of 28</div><h3>${escapeHtml(theme().title)}</h3><p>${escapeHtml(theme().carry)}</p><button class="pill" onclick="saveFavorite('today')">☆ Save thought</button> <button class="pill" onclick="chooseDay()">Choose a day</button></div><button class="card choice" onclick="start('morning')"><div class="eyebrow">☀ Begin with purpose · ~20 min</div><strong>Morning Anchor</strong><span>Prayer · Deep Bible study · Recovery · Philosophy · Gratitude · Intention</span></button><button class="card choice" onclick="start('evening')"><div class="eyebrow">☾ End with peace · ~10–15 min</div><strong>Evening Reflection</strong><span>Prayer · Step 10 · Amends · Gratitude · Scripture · Release</span></button><button class="card choice" onclick="showGrounding()"><div class="eyebrow">⚓ Two minutes · No analysis required</div><strong>Anchor Me</strong><span>Return to today. One gentle step at a time.</span></button><p class="small">${recent.length?`${recent.length} reflection(s) saved today.`:'No streaks. No catching up. You are welcome here.'}</p>${navigation()}`}
let selectedDay=null;
const oldDayIndex=dayIndex;
// theme and index resolve the selected day, while the daily cycle continues by default.
dayIndex=()=>selectedDay===null?oldDayIndex():selectedDay;
function chooseDay(){let opts=themes.map((t,i)=>`<option value="${i}" ${i===dayIndex()?'selected':''}>Day ${i+1}: ${escapeHtml(t.title)}</option>`).join('');$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">28 days · Explore at your pace</div><h2>Choose a reading</h2><p>Choose any day. Your selection remains until you return to today's reading.</p><select id="daySelect" class="field-mini">${opts}</select><div class="tools"><button class="btn" onclick="selectedDay=Number(document.getElementById('daySelect').value);showHome()">Read selected day</button><button class="btn secondary" onclick="selectedDay=null;showHome()">Return to today</button></div>${navigation()}</div>`}
function saveFavorite(kind){let t=theme();let x={id:Date.now(),day:dayIndex()+1,kind,title:t.title,reference:t.reference,content:kind==='today'?t.carry:kind==='scripture'?`${t.scripture}\n\n${t.context}`:kind==='recovery'?t.recovery:t.wisdom,date:dateKey()};if(favorites.some(f=>f.day===x.day&&f.kind===kind)){alert('Already saved in your library.');return}favorites.unshift(x);if(saveArr(libKey,favorites))alert('Saved to your wisdom library.')}
function showLibrary(){let a=favorites.map(f=>`<div class="library-entry"><div class="small-label">${escapeHtml(f.kind)} · Day ${f.day}</div><h3>${escapeHtml(f.title)}</h3><div class="reading">${escapeHtml(f.content)}</div><button class="pill danger" onclick="removeFavorite(${f.id})">Remove bookmark</button></div>`).join('');$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">Your saved readings</div><h2>Wisdom library</h2><p class="muted">Keep the passages and ideas worth returning to.</p><div class="card">${a||'No bookmarks yet. Save a passage from Morning Anchor.'}</div>${navigation()}</div>`}
function removeFavorite(id){if(!confirm('Remove this bookmark?'))return;favorites=favorites.filter(x=>x.id!==id);saveArr(libKey,favorites);showLibrary()}
function stopReading(){if('speechSynthesis' in window)window.speechSynthesis.cancel();speechOn=false}
function listenText(txt){if(!('speechSynthesis' in window)){alert('Text-to-speech is not available in this browser.');return}if(speechOn){stopReading();return}stopReading();let u=new SpeechSynthesisUtterance(txt);u.lang='en-GB';u.rate=.91;u.onend=()=>speechOn=false;u.onerror=()=>speechOn=false;window.speechSynthesis.speak(u);speechOn=true}
function listenCurrent(){let list=mode==='morning'?morning:evening;listenText(list[step][0]+'. '+list[step][1]())}
function start(m){stopReading();mode=m;step=0;answers=Array(6).fill('');allReading=false;renderSession()}
function renderSession(){stopReading();let list=mode==='morning'?morning:evening;if(allReading&&mode==='morning'){let content=list.map((item,i)=>`<div class="card"><div class="eyebrow">Section ${i+1} of ${list.length}</div><h2>${escapeHtml(item[0])}</h2><div class="reading">${escapeHtml(item[1]())}</div><div class="quote">${escapeHtml(item[2])}</div><textarea class="field" id="all${i}" placeholder="Optional reflection">${escapeHtml(answers[i])}</textarea></div>`).join('');$().innerHTML=`<div style="padding-top:25px"><div class="eyebrow">☀ Morning Anchor · Read everything</div><h2>${escapeHtml(theme().title)}</h2><div class="tools"><button class="pill" onclick="toggleAll()">Guided mode</button><button class="pill" onclick="saveFavorite('scripture')">☆ Scripture</button><button class="pill" onclick="saveFavorite('recovery')">☆ Recovery</button><button class="pill" onclick="saveFavorite('wisdom')">☆ Wisdom</button><button class="pill" onclick="listenText(${JSON.stringify('') }+document.querySelector('.read-all')?.innerText)">🔊 Listen</button><button class="pill" onclick="stopReading()">■ Stop</button></div><div class="read-all">${content}</div><div class="actions"><button class="btn secondary" onclick="saveAll(false)">Home</button><button class="btn" onclick="saveAll(true)">Finish & save</button></div></div>`;return}
let item=list[step],carry=mode==='evening'&&step===1&&morningIntention()?`<div class="card"><div class="eyebrow">Your morning intention</div><p>${escapeHtml(morningIntention())}</p></div>`:'';$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">${mode==='morning'?'☀ Morning Anchor':'☾ Evening Reflection'} · ${step+1} of ${list.length} · Day ${themeNumber()}/28</div><div class="progress"><div style="width:${(step+1)/list.length*100}%"></div></div><h2>${escapeHtml(item[0])}</h2><div class="tools">${mode==='morning'?'<button class="pill" onclick="toggleAll()">Read all sections</button>':''}<button class="pill" onclick="listenCurrent()">🔊 Listen</button><button class="pill" onclick="stopReading()">■ Stop</button>${mode==='morning'&&step===1?'<button class="pill" onclick="saveFavorite(\'scripture\')">☆ Save Scripture</button>':''}${mode==='morning'&&step===2?'<button class="pill" onclick="saveFavorite(\'recovery\')">☆ Save recovery</button>':''}${mode==='morning'&&step===3?'<button class="pill" onclick="saveFavorite(\'wisdom\')">☆ Save wisdom</button>':''}</div><div class="card"><div class="reading">${escapeHtml(item[1]())}</div></div>${carry}<p class="quote">${escapeHtml(item[2])}</p><textarea id="response" class="field" placeholder="Write here, or simply reflect in silence...">${escapeHtml(answers[step])}</textarea><p class="small">Writing is optional. Feelings are not moral failures.</p><div class="actions"><button class="btn secondary" onclick="back()">${step?'Back':'Home'}</button><button class="btn" onclick="next()">${step===list.length-1?'Finish & save':'Continue →'}</button></div></div>`}
function toggleAll(){if(allReading){for(let i=0;i<6;i++)answers[i]=document.getElementById('all'+i)?.value||answers[i]}else capture();allReading=!allReading;renderSession()}
function saveAll(done){for(let i=0;i<6;i++)answers[i]=document.getElementById('all'+i)?.value||'';allReading=false;if(done)finish();else showHome()}
function showGrounding(){stopReading();let steps=['Feel both feet supported by the floor. You do not need to fix anything right now.','Breathe at a comfortable pace. Relax your jaw and shoulders if you can.','Notice three things you can see. Name them without judging them.','Ask: What actually needs my attention in this moment?','Choose one small next action—or simply return to your day.'];let i=0;function paint(){$().innerHTML=`<div style="padding-top:60px;text-align:center"><div class="anchor">⚓</div><div class="eyebrow">Anchor Me · ${i+1} of 5</div><h2>Return to today.</h2><div class="card"><p style="font-size:1.25rem">${steps[i]}</p></div><p class="muted">No score. No journal. No need to analyse.</p><div class="actions"><button class="btn secondary" id="groundExit">Finish now</button><button class="btn" id="groundNext">${i===4?'Done':'Next →'}</button></div></div>`;document.getElementById('groundExit').onclick=showHome;document.getElementById('groundNext').onclick=()=>{if(i===4)showHome();else{i++;paint()}}}paint()}
function showPrayers(){let list=prayers.map(x=>`<div class="library-entry"><div class="small-label">${escapeHtml(x.date)} · ${escapeHtml(x.status||'In prayer')}</div><p>${escapeHtml(x.text)}</p><button class="pill" onclick="editPrayer(${x.id})">Update</button> <button class="pill danger" onclick="deletePrayer(${x.id})">Delete</button></div>`).join('');$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">Bring it to God</div><h2>Prayer journal</h2><p class="muted">A place to pray and reflect, not a scorecard of answered prayers.</p><textarea id="prayerInput" class="field" placeholder="What is on your heart?"></textarea><button class="btn" onclick="addPrayer()">Save prayer</button><div class="card">${list||'<p>No prayers saved yet.</p>'}</div>${navigation()}</div>`}
function addPrayer(){let t=document.getElementById('prayerInput').value.trim();if(!t)return;prayers.unshift({id:Date.now(),date:dateKey(),text:t,status:'In prayer'});if(saveArr(prayerKey,prayers))showPrayers()}
function editPrayer(id){let p=prayers.find(x=>x.id===id);if(!p)return;let v=prompt('Update your prayer or reflection:',p.text);if(v===null)return;p.text=v;let status=prompt('Optional note about where this prayer stands:',p.status||'In prayer');if(status!==null)p.status=status;saveArr(prayerKey,prayers);showPrayers()}
function deletePrayer(id){if(!confirm('Delete this prayer entry?'))return;prayers=prayers.filter(x=>x.id!==id);saveArr(prayerKey,prayers);showPrayers()}
function showJournal(){let items=entries.map(e=>`<div class="entry"><div class="row-between"><div class="eyebrow">${escapeHtml(e.mode)} · ${escapeHtml(e.date)} · ${escapeHtml(e.time||'')}</div><button class="pill" onclick="editEntry(${Number(e.id)})">Edit</button></div>${(e.reflections||[]).map(r=>r.answer?`<p><b>${escapeHtml(r.prompt)}</b><br>${escapeHtml(r.answer)}</p>`:'').join('')||'<p class="muted">Quiet reflection — no written notes.</p>'}</div>`).join('');let notes=freeNotes.map(n=>`<div class="entry"><div class="row-between"><div class="small-label">Free writing · ${escapeHtml(n.date)}</div><button class="pill" onclick="editFree(${n.id})">Edit</button></div><p>${escapeHtml(n.text)}</p></div>`).join('');$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">Private reflections</div><h2>My journal</h2><p class="muted">Entries stay on this device unless you export them. Back up regularly.</p><textarea id="freeText" class="field" placeholder="Write freely. No prompt required."></textarea><button class="btn" onclick="addFree()">Save free writing</button><div class="tools"><button class="pill" onclick="showWeekly()">Weekly review</button><button class="pill" onclick="showBackup()">Backup & restore</button></div><input id="journalSearch" class="field-mini" placeholder="Search entries..." oninput="filterEntries(this.value)"><div id="journalItems">${notes}${items||'<p>No guided entries yet.</p>'}</div>${navigation()}</div>`}
function filterEntries(q){let nodes=document.querySelectorAll('#journalItems .entry');nodes.forEach(n=>n.style.display=n.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
function addFree(){let t=document.getElementById('freeText').value.trim();if(!t)return;freeNotes.unshift({id:Date.now(),date:dateKey(),text:t});if(saveArr(freeKey,freeNotes))showJournal()}
function editFree(id){let n=freeNotes.find(x=>x.id===id);if(!n)return;let t=prompt('Edit your writing:',n.text);if(t===null)return;if(!t.trim()){if(confirm('Delete this entry?'))freeNotes=freeNotes.filter(x=>x.id!==id)}else n.text=t;saveArr(freeKey,freeNotes);showJournal()}
function editEntry(id){let e=entries.find(x=>Number(x.id)===id);if(!e)return;let fields=e.reflections.map((r,i)=>`<label class="small-label">${escapeHtml(r.prompt)}</label><textarea class="field" id="edit${i}">${escapeHtml(r.answer||'')}</textarea>`).join('');$().innerHTML=`<div style="padding-top:30px"><h2>Edit reflection</h2><p>${escapeHtml(e.date)} · ${escapeHtml(e.mode)}</p>${fields}<div class="tools"><button class="btn" onclick="saveEdited(${id})">Save changes</button><button class="btn secondary" onclick="showJournal()">Cancel</button><button class="btn secondary danger" onclick="deleteEntry(${id})">Delete entry</button></div></div>`}
function saveEdited(id){let e=entries.find(x=>Number(x.id)===id);if(!e)return;e.reflections.forEach((r,i)=>r.answer=document.getElementById('edit'+i).value);saveArr(key,entries);showJournal()}
function deleteEntry(id){if(!confirm('Permanently delete this reflection?'))return;entries=entries.filter(x=>Number(x.id)!==id);saveArr(key,entries);showJournal()}
function showWeekly(){let d=new Date();d.setDate(d.getDate()-6);let since=d.toLocaleDateString('en-CA');let es=entries.filter(x=>x.date>=since),ns=freeNotes.filter(x=>x.date>=since);$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">A gentle look back</div><h2>Weekly review</h2><p class="muted">${es.length} guided reflection(s), ${ns.length} free note(s) in the past seven days. No grades and no streaks.</p><div class="card"><p>What brought gratitude or peace?</p><p>Where did I show growth or kindness?</p><p>Is there one action or repair worth making?</p><p>What can I leave behind?</p></div><textarea id="weekNote" class="field" placeholder="Optional weekly reflection"></textarea><button class="btn" onclick="let t=document.getElementById('weekNote').value.trim();if(t){freeNotes.unshift({id:Date.now(),date:dateKey(),text:'Weekly review: '+t});saveArr(freeKey,freeNotes)}showJournal()">Save review</button>${navigation()}</div>`}
function showBackup(){$().innerHTML=`<div style="padding-top:30px"><div class="eyebrow">Your words belong to you</div><h2>Privacy & backups</h2><div class="card"><p>ANCHOR stores journal entries, prayers and bookmarks locally in this browser. It does not upload your entries to GitHub or an ANCHOR server.</p><p><b>Important:</b> this is not encrypted storage. Anyone with access to your unlocked browser profile may be able to access it. Clearing site data or uninstalling the app may erase it.</p><p>Export a private backup regularly. Do not upload backup files to a public repository.</p></div><div class="tools"><button class="btn" onclick="exportAll()">Export complete backup</button><label class="btn secondary" style="cursor:pointer">Import complete backup<input type="file" accept="application/json" hidden onchange="importAll(event)"></label><button class="btn secondary" onclick="exportJournal()">Legacy journal export</button></div>${navigation()}</div>`}
function exportAll(){let b=new Blob([JSON.stringify({app:'ANCHOR',version:'1.2',entries,prayers,favorites,freeNotes},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='anchor-private-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function importAll(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.app!=='ANCHOR'||!Array.isArray(d.entries))throw Error('Invalid backup');if(!confirm('Replace ALL local ANCHOR entries, prayers and bookmarks with this backup? Export your current data first.'))return;let next={entries:d.entries,prayers:Array.isArray(d.prayers)?d.prayers:[],favorites:Array.isArray(d.favorites)?d.favorites:[],freeNotes:Array.isArray(d.freeNotes)?d.freeNotes:[]};if(!saveArr(key,next.entries))return;saveArr(prayerKey,next.prayers);saveArr(libKey,next.favorites);saveArr(freeKey,next.freeNotes);entries=next.entries;prayers=next.prayers;favorites=next.favorites;freeNotes=next.freeNotes;showBackup();alert('Backup restored.')}catch{alert('Could not read this ANCHOR backup.')}};r.readAsText(f)}
showHome();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2a"><meta name="description" content="ANCHOR — faith, recovery, wisdom and reflection"><link rel="manifest" href="manifest.webmanifest"><title>ANCHOR | One day at a time</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#f4ead9;background:#101d2a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#233c4a,#101d2a 65%)}button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:620px;margin:auto;padding:24px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between}.brand{letter-spacing:.25em;color:#d8b978;font-size:1.1rem}.muted{color:#c4c7c6}.eyebrow{font:12px system-ui;letter-spacing:.15em;color:#d8b978;text-transform:uppercase}.hero{text-align:center;padding:50px 10px 30px}.anchor{font-size:46px;color:#d8b978}h1{font-weight:normal;font-size:42px;margin:10px 0}h2{font-weight:normal;font-size:31px;margin:12px 0}p{line-height:1.65}.card{background:#1c3040;border:1px solid #45606b;border-radius:20px;padding:23px;margin:14px 0;box-shadow:0 12px 32px #0002}.choice{width:100%;color:inherit;text-align:left}.choice strong{display:block;font-size:24px;font-weight:normal;margin:8px 0}.choice span{color:#cbd0cd;line-height:1.5}.btn{border:1px solid #d8b978;border-radius:12px;padding:13px 18px;background:#d8b978;color:#142432;font:600 15px system-ui}.btn.secondary{background:transparent;color:#e9d8b5}.btn:disabled{opacity:.4}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:25px}.reading{white-space:pre-line;line-height:1.85;font-size:18px}.quote{border-left:3px solid #d8b978;padding-left:18px;color:#f4e5c8}.field{width:100%;min-height:120px;resize:vertical;background:#112330;border:1px solid #5c727a;color:#fff;border-radius:12px;padding:15px;line-height:1.5}.small{font:13px system-ui;color:#b9c4c7}.nav{display:flex;gap:12px;align-items:center}.nav button{border:0;background:none;color:#e6d5b3;font:14px system-ui}.progress{height:5px;background:#39505b;border-radius:10px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:#d8b978;transition:width .2s}.hidden{display:none}.entry{border-bottom:1px solid #405763;padding:14px 0}.entry p{white-space:pre-wrap;margin:5px 0}.footer{text-align:center;margin-top:45px;font:12px system-ui;color:#aebdc0}a{color:#e9d49e}.tag{display:inline-block;background:#304754;padding:7px 10px;border-radius:20px;font:12px system-ui;color:#e9d49e}.settings{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}@media(max-width:380px){h1{font-size:34px}.shell{padding:20px 14px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">⚓ ANCHOR</div><nav class="nav"><button onclick="showHome()">Home</button><button onclick="showJournal()">Journal</button></nav></header><div id="app"></div><footer class="footer">Faith · Recovery · Wisdom · Reflection<br>One day at a time. No streaks. No guilt.</footer></main><script>
const days=[
{verse:'Proverbs 3:5–6',scripture:'Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.',thought:'Trust is not knowing every outcome. It is choosing to walk faithfully in the next step.',recovery:'Recovery asks for honesty and willingness today, not certainty about tomorrow.',wisdom:'Epictetus taught us to distinguish what depends on our choices from what does not. Practise the distinction without confusing it with surrender to God.',question:'Where can I practise trust instead of control today?'},
{verse:'Psalm 143:8',scripture:'Cause me to hear thy lovingkindness in the morning; for in thee do I trust: cause me to know the way wherein I should walk; for I lift up my soul unto thee.',thought:'Guidance can begin with a simple prayer and a willingness to listen.',recovery:'You do not have to carry the whole future. Reach out, stay connected, and do the next right thing.',wisdom:'Marcus Aurelius often returned to the idea that we can meet the present task with integrity, regardless of external circumstances.',question:'What is the next right thing in front of me?'},
{verse:'Lamentations 3:22–23',scripture:'It is of the LORD’s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.',thought:'Today is not merely a continuation of yesterday. Mercy invites a fresh beginning.',recovery:'A difficult day does not erase the work of recovery. Be truthful, ask for help and begin again.',wisdom:'The Stoics encouraged a daily return to virtue: courage, justice, moderation and wisdom.',question:'What can I begin again today without shame?'},
{verse:'Micah 6:8',scripture:'He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?',thought:'A faithful life is made up of ordinary acts of justice, kindness and humility.',recovery:'Keep your side of the street clean. Practise honesty and make amends when appropriate.',wisdom:'Character is built by repeated choices, especially when nobody is watching.',question:'How will I show kindness and humility today?'},
{verse:'Isaiah 41:10',scripture:'Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.',thought:'Courage does not require the absence of fear.',recovery:'When the day feels heavy, connection and small actions matter more than heroic promises.',wisdom:'Seneca explored how imagined troubles can burden the present. Return your attention to what is actually before you.',question:'What fear can I meet with one small courageous action?'},
{verse:'Philippians 4:6–7',scripture:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.',thought:'Prayer is a place to bring anxiety, not a test you must pass before feeling peace.',recovery:'Share what is troubling you rather than isolating with it.',wisdom:'You can respond to an anxious thought without obeying it.',question:'What worry can I name and release today?'},
{verse:'Psalm 4:8',scripture:'I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.',thought:'Rest is not something you have to earn by completing every task.',recovery:'Take stock, put right what you can, and let the rest wait until tomorrow.',wisdom:'A reflective life includes knowing when to stop striving.',question:'What can I leave in God’s hands today?'}
];
const key='anchor-journal-v1';let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]')}catch{};let mode='morning',step=0,answers=[];const $=()=>document.getElementById('app');const dateKey=()=>new Date().toLocaleDateString('en-CA');const today=()=>days[Math.floor(Date.now()/86400000)%days.length];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const morning=[['Arrive & pray',()=>`Heavenly Father, thank You for another day and another opportunity to live in faith and recovery. Guide my thoughts, words and actions. Help me accept what I cannot change, take responsibility for what I can, and be of service to others. In Jesus’ name, Amen.`, 'What am I bringing into this morning?'],['Scripture',()=>`${today().verse} (KJV)\n\n“${today().scripture}”\n\nReflection: ${today().thought}`,'What stands out to me in this passage?'],['Recovery',()=>today().recovery,'What will help me protect my recovery today?'],['Wisdom',()=>today().wisdom,today().question],['Gratitude',()=>`Pause and name three things you are thankful for. Ordinary things count. You can be grateful and still be having a difficult day.`,'Three things I am grateful for:'],['Intention',()=>`You do not need a perfect day. Be honest, stay connected, trust God and take the next right step.\n\nOne day at a time.`,'Today I intend to…']];
const evening=[['Pause & pray',()=>`Lord, help me look honestly at today without harshness or excuses. Give me humility to see what needs changing, gratitude for what was good, and peace about what I cannot fix tonight. Amen.`,'How am I feeling as I arrive here?'],['Step 10 inventory',()=>`Were you resentful, selfish, dishonest or afraid today? Is there something you could have handled better? Also notice where you showed courage, patience or love. This is a review, not a trial.`,'Where did I do well, and where did I fall short?'],['Amends & connection',()=>`If an apology or repair is needed, note an appropriate next step. If you are struggling, consider speaking with your sponsor or someone you trust. Not every situation needs to be solved tonight.`,'Is there anything I need to put right?'],['Gratitude',()=>`Even on difficult days, look for something worth thanking God for. Small moments count.`,'What were three good things today?'],['Scripture & release',()=>`Psalm 4:8 (KJV)\n\n“I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.”\n\nYou can learn from today without carrying all of it into tomorrow.`,'What can I release tonight?'],['Closing prayer',()=>`Heavenly Father, thank You for carrying me through today. Forgive my failings, show me how to make things right, and help me rest in Your care. Prepare me to begin again tomorrow. In Jesus’ name, Amen.`,'One thing I want to remember from today:']];
function showHome(){let d=new Date(),g=d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening';let recent=entries.filter(x=>x.date===dateKey());$().innerHTML=`<section class="hero"><div class="anchor">⚓</div><div class="eyebrow">A quiet place to return to</div><h1>${g}.</h1><p class="muted">“Which hope we have as an anchor of the soul...”<br><small>Hebrews 6:19 · KJV</small></p></section><button class="card choice" onclick="start('morning')"><div class="eyebrow">☀ Begin with purpose</div><strong>Morning Anchor</strong><span>Prayer · Scripture · Recovery · Wisdom · Gratitude · Intention</span></button><button class="card choice" onclick="start('evening')"><div class="eyebrow">☾ End with peace</div><strong>Evening Reflection</strong><span>Prayer · Step 10 · Amends · Gratitude · Scripture · Release</span></button><p class="small">${recent.length?`You have ${recent.length} saved reflection${recent.length===1?'':'s'} today.`:'Your reflections are yours. Nothing to catch up on.'}</p><div class="settings"><button class="btn secondary" onclick="showJournal()">Open journal</button><button class="btn secondary" onclick="exportJournal()">Export backup</button></div>`}
function start(m){mode=m;step=0;answers=Array(6).fill('');renderSession()}
function renderSession(){let list=mode==='morning'?morning:evening;let item=list[step];$().innerHTML=`<div style="padding-top:40px"><div class="eyebrow">${mode==='morning'?'☀ Morning Anchor':'☾ Evening Reflection'} · ${step+1} of ${list.length}</div><div class="progress"><div style="width:${(step+1)/list.length*100}%"></div></div><h2>${escapeHtml(item[0])}</h2><div class="card"><div class="reading">${escapeHtml(item[1]())}</div></div><p class="quote">${escapeHtml(item[2])}</p><textarea id="response" class="field" placeholder="Write here, or simply reflect in silence...">${escapeHtml(answers[step])}</textarea><p class="small">Writing is optional. Reflection is enough.</p><div class="actions"><button class="btn secondary" onclick="back()">${step?'Back':'Home'}</button><button class="btn" onclick="next()">${step===list.length-1?'Finish & save':'Continue →'}</button></div></div>`}
function capture(){answers[step]=document.getElementById('response')?.value||''}function back(){capture();if(step===0)showHome();else{step--;renderSession()}}function next(){capture();let list=mode==='morning'?morning:evening;if(step<list.length-1){step++;renderSession()}else finish()}
function finish(){let list=mode==='morning'?morning:evening;let item={id:Date.now(),date:dateKey(),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),mode,reflections:list.map((x,i)=>({prompt:x[2],answer:answers[i]}))};entries.unshift(item);try{localStorage.setItem(key,JSON.stringify(entries))}catch{alert('Could not save in this browser. Please export your reflections.')} $().innerHTML=`<section class="hero"><div class="anchor">⚓</div><h1>${mode==='morning'?'Go in peace.':'Rest in peace.'}</h1><p>You've made space for what matters.<br>One day at a time.</p><div class="tag">Reflection complete</div></section><div class="actions"><button class="btn secondary" onclick="showHome()">Home</button><button class="btn" onclick="showJournal()">View journal</button></div>`}
function showJournal(){let items=entries.map(e=>`<div class="entry"><div class="eyebrow">${e.mode==='morning'?'☀ Morning':'☾ Evening'} · ${escapeHtml(e.date)} · ${escapeHtml(e.time)}</div>${e.reflections.map(r=>r.answer?`<p><b>${escapeHtml(r.prompt)}</b><br>${escapeHtml(r.answer)}</p>`:'').join('')||'<p class="muted">Quiet reflection — no written notes.</p>'}</div>`).join('');$().innerHTML=`<div style="padding-top:32px"><div class="eyebrow">Private reflections</div><h2>Your journal</h2><p class="muted">Saved only in this browser on this device. Export regularly to keep a backup.</p><div class="settings"><button class="btn" onclick="exportJournal()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept="application/json" onchange="importJournal(event)" hidden></label></div><div class="card">${items||'<p>No entries yet. Start with one quiet moment.</p>'}</div><div class="settings"><button class="btn secondary" onclick="showHome()">Home</button><button class="btn secondary" onclick="clearJournal()">Delete journal</button></div></div>`}
function exportJournal(){let blob=new Blob([JSON.stringify({app:'ANCHOR',version:1,entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='anchor-journal-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importJournal(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(data.app!=='ANCHOR'||!Array.isArray(data.entries))throw Error();if(!confirm('Import this backup and replace the journal currently stored on this device?'))return;entries=data.entries;localStorage.setItem(key,JSON.stringify(entries));showJournal()}catch{alert('That does not look like a valid ANCHOR backup.')}};r.readAsText(f)}function clearJournal(){if(confirm('Permanently delete all saved journal entries from this browser? Export a backup first if you want to keep them.')){entries=[];localStorage.removeItem(key);showJournal()}}
showHome();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
